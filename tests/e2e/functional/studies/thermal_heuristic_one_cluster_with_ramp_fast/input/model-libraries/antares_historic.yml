library:
  id: antares_legacy_models

  port-types:
    - id: flow
      description: A port that transfers power flow.
      fields:
        - id: flow

  models:
    - id: area
      taxonomy-category: balance
      parameters:
        - id: spillage_cost
        - id: unsupplied_energy_cost
      variables:
        - id: spilled_energy
          lower-bound: 0
          variable-type: continuous
        - id: unsupplied_energy
          lower-bound: 0
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      binding-constraints:
        - id: balance
          expression: sum_connections(balance_port.flow) = spilled_energy - unsupplied_energy
      objective-contributions:
        - id: objective
          expression: expec(sum(spillage_cost * spilled_energy + unsupplied_energy_cost * unsupplied_energy))

    - id: load
      taxonomy-category: fatal_consumption
      parameters:
        - id: load
          time-dependent: true
          scenario-dependent: true
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: -load

    - id: thermal_fast_with_ramp
      taxonomy-category: dispatchable_generation
      parameters:
        - id: cluster_min_gen_modulation
          scenario-dependent: true
          time-dependent: true
        - id: cluster_max_generation
          scenario-dependent: true
          time-dependent: true
        - id: min_power_per_unit
        - id: max_power_per_unit
        - id: market_bid_cost
        - id: startup_cost
        - id: fixed_cost
        - id: min_up_duration
        - id: min_down_duration
        - id: num_units
        - id: spinning
        - id: max_upward_ramping_rate
        - id: max_downward_ramping_rate
      variables:
        - id: generation_power
          lower-bound: min(max(cluster_max_generation*(1-spinning/100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit)), cluster_min_gen_modulation * num_units * max_power_per_unit)
          upper-bound: max(cluster_max_generation*(1-spinning/100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit))
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: generation_power
      objective-contributions:
        - id: objective
          expression: expec(sum(market_bid_cost * generation_power))
      extra-outputs:
        - id: num_units_on
          expression: ceil(generation_power / max_power_per_unit)
