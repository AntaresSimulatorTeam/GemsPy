system:

  components:
    - id: N
      model: antares_legacy_models.area
      parameters:
        - id: spillage_cost
          value: 100
        - id: unsupplied_energy_cost
          value: 10000
    - id: D
      model: antares_legacy_models.load
      parameters:
        - id: load
          time-dependent: true
          value: demand-ts
    - id: G
      model: antares_legacy_models.thermal_with_ramp
      parameters:
        - id: max_power_per_unit
          value: 500
        - id: min_power_per_unit
          value: 100
        - id: cluster_max_generation
          value: 1500
        - id: cluster_min_gen_modulation
          value: 0
        - id: market_bid_cost
          value: 10
        - id: startup_cost
          value: 10
        - id: fixed_cost
          value: 0
        - id: min_up_duration
          value: 1
        - id: min_down_duration
          value: 1
        - id: num_units
          value: 3
        - id: spinning
          value: 0
        - id: max_upward_ramping_rate
          value: 30
        - id: max_downward_ramping_rate
          value: 30

  connections:
    - component1: N
      port1: balance_port
      component2: D
      port2: balance_port

    - component1: N
      port1: balance_port
      component2: G
      port2: balance_port
