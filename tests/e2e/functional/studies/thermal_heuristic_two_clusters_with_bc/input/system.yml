system:

  components:
    - id: N
      model: antares_legacy_models.area
      parameters:
        - id: spillage_cost
          value: 0
        - id: unsupplied_energy_cost
          value: 1000
    - id: D
      model: antares_legacy_models.load
      parameters:
        - id: load
          time-dependent: true
          value: demand-ts
    - id: G1
      model: antares_legacy_models.thermal
      parameters:
        - id: max_power_per_unit
          value: 1000
        - id: min_power_per_unit
          value: 700
        - id: cluster_max_generation
          value: 3000
        - id: cluster_min_gen_modulation
          value: 0
        - id: market_bid_cost
          value: 50
        - id: startup_cost
          value: 50
        - id: fixed_cost
          value: 1
        - id: min_up_duration
          value: 3
        - id: min_down_duration
          value: 10
        - id: num_units
          value: 3
        - id: spinning
          value: 0
    - id: G2
      model: antares_legacy_models.thermal
      parameters:
        - id: max_power_per_unit
          value: 500
        - id: min_power_per_unit
          value: 50
        - id: cluster_max_generation
          value: 1000
        - id: cluster_min_gen_modulation
          value: 0
        - id: market_bid_cost
          value: 150
        - id: startup_cost
          value: 20
        - id: fixed_cost
          value: 2
        - id: min_up_duration
          value: 4
        - id: min_down_duration
          value: 4
        - id: num_units
          value: 2
        - id: spinning
          value: 0
    - id: upper_bound_sum
      model: antares_legacy_models.bc
      parameters:
        - id: upper_bound
          value: 2050


  connections:
    - component1: N
      port1: balance_port
      component2: D
      port2: balance_port

    - component1: N
      port1: balance_port
      component2: G1
      port2: balance_port

    - component1: N
      port1: balance_port
      component2: G2
      port2: balance_port

    - component1: upper_bound_sum
      port1: balance_port
      component2: G1
      port2: balance_port

    - component1: upper_bound_sum
      port1: balance_port
      component2: G2
      port2: balance_port
