library:
  id: antares_legacy_models

  port-types:
    - id: flow
      description: A port that transfers power flow.
      fields:
        - id: flow

  models:
    - id: area
      taxonomy-category: balance
      parameters:
        - id: spillage_cost
        - id: unsupplied_energy_cost
      variables:
        - id: spilled_energy
          lower-bound: 0
          variable-type: continuous
        - id: unsupplied_energy
          lower-bound: 0
          variable-type: continuous
      ports:
        - id: balance_port
          type: flow
      binding-constraints:
        - id: balance
          expression: sum_connections(balance_port.flow) = spilled_energy - unsupplied_energy
      objective-contributions:
        - id: objective
          expression: expec(sum(spillage_cost * spilled_energy + unsupplied_energy_cost * unsupplied_energy))

    - id: load
      taxonomy-category: fatal_consumption
      parameters:
        - id: load
          time-dependent: true
          scenario-dependent: true
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: -load

    - id: thermal_with_ramp
      taxonomy-category: dispatchable_generation
      parameters:
        - id: cluster_min_gen_modulation
          scenario-dependent: true
          time-dependent: true
        - id: cluster_max_generation
          scenario-dependent: true
          time-dependent: true
        - id: min_power_per_unit
        - id: max_power_per_unit
        - id: market_bid_cost
        - id: startup_cost
        - id: fixed_cost
        - id: min_up_duration
        - id: min_down_duration
        - id: num_units
        - id: spinning
        - id: max_upward_ramping_rate
        - id: max_downward_ramping_rate
      variables:
        - id: generation_power
          lower-bound: min(max(cluster_max_generation*(1-spinning/100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit)), cluster_min_gen_modulation * num_units * max_power_per_unit)
          upper-bound: max(cluster_max_generation*(1-spinning/100), min_power_per_unit * ceil(cluster_max_generation / max_power_per_unit))
          variable-type: continuous
        - id: num_units_on
          lower-bound: ceil(min(cluster_max_generation/max_power_per_unit, cluster_min_gen_modulation * num_units * max_power_per_unit/(max_power_per_unit*(1-spinning/100))))
          upper-bound: ceil(cluster_max_generation/max_power_per_unit)
          variable-type: integer
        - id: num_units_starting
          lower-bound: 0
          variable-type: integer
        - id: num_units_stopping
          lower-bound: 0
          variable-type: integer
        - id: num_units_failing
          lower-bound: 0
          upper-bound: max(0, (ceil(cluster_max_generation/max_power_per_unit))[t-1] - (ceil(cluster_max_generation/max_power_per_unit)))
          variable-type: integer
      ports:
        - id: balance_port
          type: flow
      port-field-definitions:
        - port: balance_port
          field: flow
          definition: generation_power
      constraints:
        - id: max_generation
          expression: generation_power <= num_units_on * max_power_per_unit*(1-spinning/100)
        - id: min_generation
          expression: generation_power >= num_units_on * min_power_per_unit
        - id: on_units_dynamics
          expression: num_units_on = num_units_on[t-1] + num_units_starting - num_units_stopping
        - id: num_units_failing_lower_than_stopping
          expression: num_units_failing <= num_units_stopping
        - id: min_up_duration_cst
          expression: sum(t-min_up_duration + 1 .. t, num_units_starting - num_units_failing) <= num_units_on
        - id: min_down_duration_cst
          expression: sum(t-min_down_duration + 1 .. t, num_units_stopping) <= ((ceil(cluster_max_generation/max_power_per_unit)))[t-min_down_duration] - num_units_on + sum(t-min_down_duration + 1 .. t, max(0, ceil(cluster_max_generation/max_power_per_unit) - (ceil(cluster_max_generation/max_power_per_unit))[t-1]))
        - id: max_upward
          expression: generation_power <= generation_power[t-1] + max_upward_ramping_rate * num_units_on + max_power_per_unit * num_units_starting
        - id: max_downward
          expression: generation_power >= generation_power[t-1] - max_downward_ramping_rate * num_units_on - max_power_per_unit * num_units_stopping
      objective-contributions:
        - id: objective
          expression: expec(sum(market_bid_cost * generation_power + startup_cost * num_units_starting + fixed_cost * num_units_on))
