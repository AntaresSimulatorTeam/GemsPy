system:

  components:
    - id: N
      model: antares_legacy_models.area
      parameters:
        - id: spillage_cost
          value: 1
        - id: unsupplied_energy_cost
          value: 10000
    - id: D
      model: antares_legacy_models.load
      parameters:
        - id: load
          time-dependent: true
          scenario-dependent: true
          value: demand-ts
    - id: G1
      model: antares_legacy_models.thermal
      parameters:
        - id: max_power_per_unit
          value: 410
        - id: min_power_per_unit
          value: 180
        - id: cluster_max_generation
          time-dependent: true
          scenario-dependent: true
          value: series_G1
        - id: cluster_min_gen_modulation
          value: 0
        - id: market_bid_cost
          value: 96
        - id: startup_cost
          value: 100500
        - id: fixed_cost
          value: 1
        - id: min_up_duration
          value: 8
        - id: min_down_duration
          value: 8
        - id: num_units
          value: 1
        - id: spinning
          value: 0
    - id: G2
      model: antares_legacy_models.thermal
      parameters:
        - id: max_power_per_unit
          value: 90
        - id: min_power_per_unit
          value: 60
        - id: cluster_max_generation
          time-dependent: true
          scenario-dependent: true
          value: series_G2
        - id: cluster_min_gen_modulation
          value: 0
        - id: market_bid_cost
          value: 137
        - id: startup_cost
          value: 24500
        - id: fixed_cost
          value: 1
        - id: min_up_duration
          value: 11
        - id: min_down_duration
          value: 11
        - id: num_units
          value: 3
        - id: spinning
          value: 0
    - id: G3
      model: antares_legacy_models.thermal
      parameters:
        - id: max_power_per_unit
          value: 275
        - id: min_power_per_unit
          value: 150
        - id: cluster_max_generation
          time-dependent: true
          scenario-dependent: true
          value: series_G3 
        - id: cluster_min_gen_modulation
          value: 0
        - id: market_bid_cost
          value: 107
        - id: startup_cost
          value: 69500
        - id: fixed_cost
          value: 1
        - id: min_up_duration
          value: 9
        - id: min_down_duration
          value: 9
        - id: num_units
          value: 4
        - id: spinning
          value: 0


  connections:
    - component1: N
      port1: balance_port
      component2: D
      port2: balance_port

    - component1: N
      port1: balance_port
      component2: G1
      port2: balance_port

    - component1: N
      port1: balance_port
      component2: G2
      port2: balance_port

    - component1: N
      port1: balance_port
      component2: G3
      port2: balance_port
