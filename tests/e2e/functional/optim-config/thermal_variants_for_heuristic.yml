# Shared by every thermal-heuristic e2e case, across every mode. Declares
# heuristics for all four thermal models side by side (thermal, thermal_fast,
# thermal_with_ramp, thermal_fast_with_ramp); callers
# (thermal_heuristic_helpers.optim_config_for) trim this down to just the
# entry matching whichever model the case's components resolve to.
# milp/lp never look up a heuristic, so those modes use a bare config instead.
models:
  - id: antares_legacy_models.thermal
    heuristics:
      - id: accurate
        inputs:
          - heuristic-element: num_units_on_opt
            id: num_units_on
            type: variable-solution
          - heuristic-element: num_units_max
            id: num_units_on
            type: variable-upper-bound
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_num_units_on
            id: num_units_on
            type: variable-lower-bound
    
  - id: antares_legacy_models.thermal_fast
    heuristics:
      - id: fast
        inputs:
          - heuristic-element: generation_power
            id: generation_power
            type: variable-solution
          - heuristic-element: cluster_max_generation
            id: cluster_max_generation
          - heuristic-element: min_power_per_unit
            id: min_power_per_unit
          - heuristic-element: max_power_per_unit
            id: max_power_per_unit
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_generation_power
            id: generation_power
            type: variable-lower-bound
  
  - id: antares_legacy_models.thermal_with_ramp
    heuristics:
      - id: accurate
        inputs:
          - heuristic-element: num_units_on_opt
            id: num_units_on
            type: variable-solution
          - heuristic-element: num_units_max
            id: num_units_on
            type: variable-upper-bound
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_num_units_on
            id: num_units_on
            type: variable-lower-bound
  
  - id: antares_legacy_models.thermal_fast_with_ramp
    heuristics:
      - id: fast
        inputs:
          - heuristic-element: generation_power
            id: generation_power
            type: variable-solution
          - heuristic-element: cluster_max_generation
            id: cluster_max_generation
          - heuristic-element: min_power_per_unit
            id: min_power_per_unit
          - heuristic-element: max_power_per_unit
            id: max_power_per_unit
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_generation_power
            id: generation_power
            type: variable-lower-bound
