# Shared by every non-ramp thermal-heuristic e2e case running in accurate mode
# (milp/lp modes never look up a heuristic, so they never load this file either).
# Not valid for fast mode: the fast library's `num_units_on` is an extra-output,
# not a variable, so the accurate heuristic below would fail validation against
# it — see thermal_fast.yml for that case.
models:
  - id: antares_legacy_models.thermal
    heuristic:
      - id: accurate
        inputs:
          - heuristic-element: nb_units_on_opt
            id: num_units_on
            type: variable-solution
          - heuristic-element: nb_units_max
            id: num_units_on
            type: variable-upper-bound
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_nb_units_on
            id: num_units_on
            type: variable-lower-bound
    
  - id: antares_legacy_models.thermal_fast
    heuristic:
      - id: fast
        inputs:
          - heuristic-element: generation_power
            id: generation_power
            type: variable-solution
          - heuristic-element: cluster_max_generation
            id: cluster_max_generation
          - heuristic-element: min_power_per_unit
            id: min_power_per_unit
          - heuristic-element: max_power_per_unit
            id: max_power_per_unit
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_generation_power
            id: generation_power
            type: variable-lower-bound
  
  - id: antares_legacy_models.thermal_with_ramp
    heuristic:
      - id: accurate
        inputs:
          - heuristic-element: nb_units_on_opt
            id: num_units_on
            type: variable-solution
          - heuristic-element: nb_units_max
            id: num_units_on
            type: variable-upper-bound
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_nb_units_on
            id: num_units_on
            type: variable-lower-bound
  
  - id: antares_legacy_models.thermal_fast_with_ramp
    heuristic:
      - id: fast
        inputs:
          - heuristic-element: generation_power
            id: generation_power
            type: variable-solution
          - heuristic-element: cluster_max_generation
            id: cluster_max_generation
          - heuristic-element: min_power_per_unit
            id: min_power_per_unit
          - heuristic-element: max_power_per_unit
            id: max_power_per_unit
          - heuristic-element: min_up_duration
            id: min_up_duration
          - heuristic-element: min_down_duration
            id: min_down_duration
        outputs:
          - heuristic-element: minimum_generation_power
            id: generation_power
            type: variable-lower-bound
